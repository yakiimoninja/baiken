[package]
name = "baiken"
version = "2.4.0"
edition = "2021"
authors = ["yakiimoninja"]
repository = "https://github.com/yakiimoninja/baiken"
description = "A Discord bot that displays Guilty Gear Strive framedata and more."
license = "GPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
poise = "0.6.2"
dotenv = "0.15"
serde_json = "1.0.151"
serde = "1.0.229"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "fallible_uint"] }
ureq = { version = "3.4.1", features = ["charset", "json", "cookies"] }
md-5 = "0.11.0"
base16ct = "1.0.0"
nanorand = "0.8.0"
colored = "3.1.1"
regex = "1.13.1"
aho-corasick = "1.1.5"
